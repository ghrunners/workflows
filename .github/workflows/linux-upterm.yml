name: upterm session (managed, redacted)

# Manual upterm (no owenthereal/action-upterm): that action prints the SSH
# command via core.info/notice/console.log AND writes it to the job summary,
# which cannot be masked in time. With PUBLIC per-runner repos anyone could
# read it. Here every byte of upterm output goes to a file; only the
# redacted placeholder reaches the logs. The real ssh command is masked
# (::add-mask::) and POSTed to the web tool, never echoed.
# Ephemeral key: the web tool generates one ed25519 keypair per runner,
# adds the PUBLIC key to the temp account (POST /user/keys) BEFORE dispatch,
# and shows the PRIVATE key only in the web UI. --github-user authorizes
# exactly that account's keys.

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: "Worker callback URL (https://<worker>/api/callback)"
        required: true
        type: string
      callback_token:
        description: "One-time bearer token for this runner"
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Prereqs (root shell + land in HOME)
        run: |
          # Interactive shells auto-escalate to root and land at HOME (/root),
          # not $GITHUB_WORKSPACE. Workflow steps are non-interactive bash.
          if ! grep -q "IN_ROOT_SHELL" ~/.bashrc 2>/dev/null; then
            printf '\nif [ "$(id -u)" -ne 0 ] && [ -z "$IN_ROOT_SHELL" ]; then export IN_ROOT_SHELL=1; exec sudo -i; fi\n' >> ~/.bashrc
          fi
          if ! grep -q "cd /root" ~/.bashrc 2>/dev/null; then
            printf 'cd /root 2>/dev/null || cd ~ 2>/dev/null || true\n' >> ~/.bashrc
          fi
          sudo mkdir -p /root
          if ! sudo grep -q "cd /root" /root/.bashrc 2>/dev/null; then
            echo 'cd /root 2>/dev/null || cd ~ 2>/dev/null || true' | sudo tee -a /root/.bashrc >/dev/null
          fi
          sudo rm -rf /root/* 2>/dev/null || true
          sudo mkdir -p /root
          if ! command -v tmux >/dev/null 2>&1; then sudo apt-get update && sudo apt-get -y install tmux; fi
          echo "prereqs ok"

      - name: Setup upterm session (ssh command redacted, sent to web tool)
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          UPTERM_ACTOR: ${{ github.triggering_actor }}
        run: |
          set +x
          echo "::add-mask::$CALLBACK_TOKEN"
          # Run setup as $RUNNER (HOME=/home/runner). Only the upterm daemon
          # itself runs via sudo with HOME=/root so terminals land in a root
          # shell. Touching /root as runner fails (700 root:root) - that was
          # killing the job at mkdir -p ~/.ssh with exit 1 under bash -e.
          cd ~ || true

          clean_ansi() {
            printf '%s' "$1" | sed -r -e 's/\x1b\][^\x07]*(\x07|\x1b\\)//g' -e 's/\x1b\[[0-9;?]*[ -\/]*[@-~]//g' | tr -d '\r'
          }

          # --- install upterm binary ---
          ARCH=amd64; case "$(uname -m)" in aarch64|arm64) ARCH=arm64;; esac
          UTMP="$(mktemp -d)"
          curl -sSfL "https://github.com/owenthereal/upterm/releases/latest/download/upterm_linux_${ARCH}.tar.gz" -o "$UTMP/upterm.tgz"
          tar xzf "$UTMP/upterm.tgz" -C "$UTMP"
          UPTERM="$UTMP/upterm"
          chmod +x "$UPTERM"

          # --- minimal ssh client setup (mirrors action-upterm) ---
          mkdir -p ~/.ssh
          [ -f ~/.ssh/id_rsa ] || ssh-keygen -q -t rsa -N "" -f ~/.ssh/id_rsa
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          if ! grep -q "StrictHostKeyChecking no" ~/.ssh/config 2>/dev/null; then
            printf 'Host *\n  StrictHostKeyChecking no\n  CheckHostIP no\n  TCPKeepAlive yes\n  ServerAliveInterval 30\n  ServerAliveCountMax 180\n  AddressFamily inet\n' >> ~/.ssh/config
          fi

          # --- deterministic XDG dirs (mirrors action-upterm) ---
          export XDG_RUNTIME_DIR=/tmp/upterm-data/runtime XDG_STATE_HOME=/tmp/upterm-data/state XDG_CONFIG_HOME=/tmp/upterm-data/config
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME"
          SOCKDIR="$XDG_RUNTIME_DIR/upterm"
          CMDLOG="$XDG_STATE_HOME/upterm-command.log"
          printf '# upterm tmux conf\nset-environment -g XDG_RUNTIME_DIR "%s"\nset-environment -g XDG_STATE_HOME "%s"\nset-environment -g XDG_CONFIG_HOME "%s"\nset-option -ga update-environment " UPTERM_ADMIN_SOCKET"\nsetw -g aggressive-resize on\n' \
            "$XDG_RUNTIME_DIR" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" > /tmp/upterm-data/tmux.conf

          # --- start session detached as root; ALL output goes to file, never to logs ---
          # NOTE: sudo strips XDG_* unless passed explicitly, so pass them through.
          sudo XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" XDG_STATE_HOME="$XDG_STATE_HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" HOME=/root \
            tmux -f /tmp/upterm-data/tmux.conf new -d -s upterm-wrapper -x 132 -y 43 \
            "$UPTERM host --skip-host-key-check --accept --server 'ssh://uptermd.upterm.dev:22' --github-user \"$UPTERM_ACTOR\" --force-command 'tmux attach -t upterm' -- tmux -f /tmp/upterm-data/tmux.conf new -s upterm -x 132 -y 43 2>&1 | tee $CMDLOG"

          # --- wait for admin socket ---
          SOCK=""
          for i in $(seq 1 60); do
            SOCK="$(ls "$SOCKDIR"/*.sock 2>/dev/null | head -n1)"
            [ -n "$SOCK" ] && break
            sleep 2
          done
          if [ -z "$SOCK" ]; then
            echo "upterm failed to start (no admin socket in $SOCKDIR)"
            echo "--- ls /tmp/upterm-data ---"; ls -R /tmp/upterm-data 2>/dev/null | head -n 30
            echo "--- sudo ls /tmp/upterm-data ---"; sudo ls -R /tmp/upterm-data 2>/dev/null | head -n 30
            echo "--- find sockets ---"; sudo find /tmp /root -name "*.sock" 2>/dev/null | head -n 20
            echo "--- tmux pane ---"; sudo tmux -f /tmp/upterm-data/tmux.conf capture-pane -t upterm-wrapper -p 2>/dev/null | tail -n 30 | sed 's/ssh [^ ]*@[^ ]*/ssh [REDACTED]/g'
            echo "--- cmdlog ---"; tail -n 50 "$CMDLOG" 2>/dev/null | sed 's/ssh [^ ]*@[^ ]*/ssh [REDACTED]/g'
            exit 1
          fi

          # --- extract ssh command from socket (never printed) ---
          INFO="$(sudo XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" XDG_STATE_HOME="$XDG_STATE_HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" HOME=/root "$UPTERM" session current --admin-socket "$SOCK" 2>/dev/null)"
          SSH_CMD="$(printf '%s' "$INFO" | grep -oE 'ssh [^[:space:]]+@[^[:space:]]+' | head -n1)"
          SSH_CMD="$(clean_ansi "$SSH_CMD" | awk '{print $1, $2}')"
          if [ -z "$SSH_CMD" ]; then echo "could not parse ssh command"; exit 1; fi
          echo "::add-mask::$SSH_CMD"
          PAYLOAD="$(jq -n --arg s "$SSH_CMD" '{type:"upterm",ssh_command:$s}')"
          curl -sSf -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || { echo "callback failed"; exit 1; }
          echo "SSH command delivered to web tool (redacted from logs). Session live."

          # --- keepalive: hold the job without ever printing session info ---
          DEADLINE=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 15
            [ -f /continue ] || [ -f "$GITHUB_WORKSPACE/continue" ] && { echo "continue file found, exiting"; break; }
            ls "$SOCKDIR"/*.sock >/dev/null 2>&1 || { echo "session ended"; break; }
            sudo tmux -f /tmp/upterm-data/tmux.conf has-session -t upterm-wrapper 2>/dev/null || { echo "session ended"; break; }
          done
